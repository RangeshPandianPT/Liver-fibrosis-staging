name: Automated Liver Staging CI/CD

on:
  push:
    branches: [ "main", "staging", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    name: 🧪 Python Test & Quality Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: 📥 Checkout Codebase
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-cov

      - name: 🎨 Run Ruff Linter & Syntax Check
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          ruff check . --select=E9,F63,F7,F82 --show-source
          # Exit-zero treats all errors as warnings
          ruff check . --exit-zero

      - name: 🧪 Execute Pytest Test Suite
        run: |
          pytest tests/ -v --cov=src --cov-report=xml

      - name: 📊 Upload Coverage Report
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  docker-build:
    name: 🐳 Verify Docker Build
    runs-on: ubuntu-latest
    needs: test-and-lint
    steps:
      - name: 📥 Checkout Codebase
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: automated-liver-staging:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
