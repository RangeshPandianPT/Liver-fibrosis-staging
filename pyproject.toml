[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "liver-fibrosis-staging"
version = "1.0.0"
description = "Automated Liver Fibrosis Staging Clinical AI Platform & Open-Source Benchmark"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "ALS Research Team"}
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "scikit-learn>=1.3.0",
    "seaborn>=0.12.0",
    "matplotlib>=3.7.0",
    "pytorch-grad-cam>=1.4.8",
    "tqdm>=4.65.0",
    "scipy>=1.11.0",
    "timm>=0.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    "httpx>=0.24.0",
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
    "typer>=0.9.0"
]

[project.scripts]
liver-stage = "src.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]
